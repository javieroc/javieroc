<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Javier Ocampo — Full Stack Developer">
  <defs>
    <radialGradient id="spot" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1c1d26"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f2efe6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2efe6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip">
      <text x="600" y="168" text-anchor="middle" class="title">JAVIER OCAMPO</text>
    </clipPath>
    <pattern id="perf" width="36" height="22" patternUnits="userSpaceOnUse">
      <rect x="10" y="6" width="16" height="10" rx="2" fill="#07070a"/>
    </pattern>
    <style>
      .title { font: 700 84px Georgia, 'Times New Roman', serif; letter-spacing: 14px; }
      .sub   { font: 400 17px 'Courier New', Courier, monospace; letter-spacing: 6px; fill: #9a9aa6; }
      .cast  { font: 700 12px 'Courier New', Courier, monospace; letter-spacing: 4px; }
      .reveal { opacity: 0; animation: in 1.6s ease-out forwards; }
      .d1 { animation-delay: .5s } .d2 { animation-delay: 1.1s } .d3 { animation-delay: 1.5s }
      .d4 { animation-delay: 1.7s } .d5 { animation-delay: 1.9s } .d6 { animation-delay: 2.1s }
      @keyframes in { to { opacity: 1 } }
      .flicker { animation: flicker 6s infinite steps(1); }
      @keyframes flicker { 0%,100% { opacity: 1 } 47% { opacity: .82 } 48% { opacity: 1 } 73% { opacity: .9 } 74% { opacity: 1 } }
      .beam { animation: sweep 5s ease-in-out 2.4s infinite; }
      @keyframes sweep { 0% { transform: translateX(-420px) } 60%,100% { transform: translateX(1200px) } }
      .bar { transform-origin: center; transform: scaleX(0); animation: grow 1.2s ease-out forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
    </style>
  </defs>

  <!-- screen -->
  <rect width="1200" height="340" fill="url(#spot)"/>

  <!-- film strip edges -->
  <rect y="0" width="1200" height="22" fill="#15151b"/>
  <rect y="0" width="1200" height="22" fill="url(#perf)"/>
  <rect y="318" width="1200" height="22" fill="#15151b"/>
  <rect y="318" width="1200" height="22" fill="url(#perf)"/>

  <g class="flicker">
    <!-- overline -->
    <text x="600" y="78" text-anchor="middle" class="sub reveal">A FULL STACK PRODUCTION</text>

    <!-- title -->
    <text x="600" y="168" text-anchor="middle" class="title reveal d1" fill="#f2efe6">JAVIER OCAMPO</text>
    <g clip-path="url(#titleClip)">
      <rect class="beam" x="0" y="80" width="300" height="110" fill="url(#sweep)" opacity=".55"/>
    </g>

    <!-- villain colour bars -->
    <g transform="translate(330 196)">
      <rect class="bar d2" x="0"   width="126" height="3" fill="#ff6a1a"/>
      <rect class="bar d3" x="138" width="126" height="3" fill="#3d7bff"/>
      <rect class="bar d4" x="276" width="126" height="3" fill="#2bd96b"/>
      <rect class="bar d5" x="414" width="126" height="3" fill="#a24bff"/>
    </g>

    <!-- cast -->
    <g class="reveal d6" text-anchor="middle">
      <text x="393" y="226" class="cast" fill="#ff6a1a">SMAUG</text>
      <text x="531" y="226" class="cast" fill="#3d7bff">APOCALYPSE</text>
      <text x="669" y="226" class="cast" fill="#2bd96b">AGENT SMITH</text>
      <text x="807" y="226" class="cast" fill="#a24bff">THE JOKER</text>
    </g>

    <text x="600" y="282" text-anchor="middle" class="sub reveal d6">FULL STACK DEVELOPER · COLLECTOR OF GREAT VILLAINS</text>
  </g>
</svg>
